[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pybroswer"
version = "0.3.0"
description = "Python 3.12+ browser for PyDroid. Works on phone without Chromium or a PC host."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "pybroswer" }]
keywords = ["playwright", "chromium", "browser", "remote", "automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
chromium = [
    "playwright>=1.40",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
pybroswer = "pybroswer.__main__:main"

[project.urls]
Homepage = "https://github.com/prateeknishad305/chromium-remote-api"

[tool.hatch.build.targets.wheel]
packages = ["src/pybroswer"]

[tool.hatch.build.targets.wheel.sources]
src = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
