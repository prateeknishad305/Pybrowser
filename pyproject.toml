[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pybroswer"
version = "0.3.1"
description = "Python browser for PyDroid. Works on phone without Chromium or a PC host."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hacker78" }]
keywords = ["playwright", "chromium", "browser", "pydroid", "remote", "automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
chromium = [
    "playwright>=1.40",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
pybroswer = "pybroswer.__main__:main"

[project.urls]
Homepage = "https://github.com/prateeknishad305/Pybrowser"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
